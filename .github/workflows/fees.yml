# Fee rounds every 15 minutes, HIRE's cadence. Vercel Hobby allows only a daily cron, so GitHub runs
# the clock and the app does the work. Secrets: FEES_URL (https://app.everynth.org/api/cron/fees)
# and CRON_SECRET (the same value the Vercel project holds).
name: fee rounds
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Run a fee round
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.FEES_URL }}")
          cat /tmp/out.json; echo
          test "$code" = "200"
